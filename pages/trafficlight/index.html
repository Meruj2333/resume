<!doctype html>
<html >
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Լուսացույց — հերթական լույսեր (one-at-a-time)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body >
<div class="bgColor">
<div class="container">
    <div class="traffic" aria-label="Traffic light">
        <div id="red"    class="light red"    title="Red"></div>
        <div id="yellow" class="light yellow" title="Yellow"></div>
        <div id="green"  class="light green"  title="Green"></div>
    </div>

    <div class="controls">
        <div id="counter" class="counter">0</div>
        <button id="stepBtn">Սեղմել</button>
        <button id="resetBtn" style="background:#ef4444">Ֆիքսել 0</button>
    </div>

    <div class="note">
    </div>
</div>
</div>
<script src="index.js"></script>

</body>
</html>
