<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register & Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        #error{
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <button type="button" class="btn btn-primary w-100 btnReg ">Register</button>
    <button  style="margin: 10px 0" type="button" class="btn btn-primary w-100 btnLog ">login</button>

    <div class="row">
        <!-- Registration Form -->
        <div class="col-md-4">
            <div class="card cardReg">
                <div class="card-header">Register</div>
                <div class="card-body">
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Enter your name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter your password">
                        </div>
                        <div class="mb-3">
                            <label for="cpassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="cpassword" placeholder="Confirm your password">

                        </div>

                        <button type="button" class="btn btn-primary w-100 reg-btn">Register</button>
                    </form>
                    <p id="error" style="color:red">error</p>

                </div>
            </div>
        </div>

        <!-- Registered List -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">Registered List</div>
                <div class="card-body">
                    <ul class="list-group">

                    </ul>
                </div>
            </div>
        </div>

        <!-- Login Form -->
        <div class="col-md-4">
            <div class="card cardLog">
                <div class="card-header">Login</div>
                <div class="card-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password">
                        </div>
                        <button type="button" class="btn btn-primary w-100" onclick="showHome()">Login</button>
                        <p id="errorlog" style="color:red">գաղտնաբառի կամ email-ի սխալ</p>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Home Section -->
    <div class="row" id="homeSection">
        <div class="col-md-12">
            <div class="card mt-4">
                <div class="card-header">Home</div>
                <div class="card-body text-center">
                    <h3>Welcome to the Home Page!</h3>
                    <button class="btn btn-danger mt-3" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="script.js"></script>

</body>
</html>
