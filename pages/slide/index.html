<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Նկարների սլայդեր</title>
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .carousel {
            width: 700px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #000;
            padding-bottom: 90px; /* տեղ thumbnails-ի համար */
        }

        .carousel-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
        }

        .prev,
        .next {
            position: absolute;
            top: 45%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 50%;
            z-index: 10;
        }

        .prev { left: 10px; }
        .next { right: 10px; }

        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .indicators {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
        }

        .indicator.active {
            background-color: white;
        }

        /* Thumbnail հատված */
        .thumbnails {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .thumbnail {
            width: 90px;
            height: 60px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail.active {
            opacity: 1;
            border-color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="carousel">
    <div class="carousel-item">
        <img src="https://placehold.co/600x400?text=1" id="activeImage" alt="Նկար 1" />
    </div>

    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>

    <div class="indicators"></div>
    <div class="thumbnails"></div> <!-- տեղափոխված է ներս -->
</div>

<script src="script.js"></script>
</body>
</html>
